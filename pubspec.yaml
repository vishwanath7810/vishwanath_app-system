name: vishwanath_app
description: A production-level College ERP System built with Flutter, Riverpod, Firebase & Supabase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  # 🧠 State Management
  flutter_riverpod: ^2.4.9

  # 🚦 Routing (for future clean navigation)
  go_router: ^13.2.0

  # 📁 File Handling

  image_picker: ^1.0.7

  # 📦 Supabase (for file upload like your Java app)
  supabase_flutter: ^2.3.4

  # 🌍 Date Formatting
  intl: ^0.19.0

  # 💎 UI
  google_fonts: ^6.1.0

  # 🛠 Utility
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true